[project]
name = "ironclad-sandbox"
version = "0.1.0"
description = "Secure AI agent code execution sandbox powered by Pydantic Monty"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Koketso Raphasha", email = "402106633@my.richfield.ac.za"},
]
keywords = ["ai", "agent", "sandbox", "monty", "pydantic", "security", "code-execution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Interpreters",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-ai>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
